[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
http = "1.3.1"
once_cell = "1.21.3"
rusqlite = "0.37.0"
serde = {version = "1.0.225", features = ["derive"]}
serde_json = "1.0.145"
tokio = { version = "1.47.1", features= ["full"] }
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
bollard = "0.19.2"
futures-util = "0.3.31"
tar = "0.4.44"
flate2 = "1.1.2"
http-body-util = "0.1"
futures = "0.3.31"

[workspace.lints.clippy]
all = "deny"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
